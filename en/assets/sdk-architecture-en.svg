<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16324a" stroke-width="1"/>
    </pattern>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2437"/>
      <stop offset="1" stop-color="#0b1a28"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#08131d"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>

  <text x="60" y="66" fill="#4fd1c5" font-size="21" letter-spacing="6" font-weight="600">AGGREGATED AD SDK / LAYERED ARCHITECTURE</text>
  <text x="1540" y="66" fill="#7d93a8" font-size="19" letter-spacing="4" text-anchor="end">ANDROID · FLUTTER · REACT NATIVE</text>
  <line x1="60" y1="92" x2="1540" y2="92" stroke="#1f4056" stroke-width="1.5"/>

  <!-- host app -->
  <text x="60" y="215" fill="#7d93a8" font-size="17" letter-spacing="3">HOST APP</text>
  <line x1="60" y1="240" x2="175" y2="240" stroke="#4fd1c5" stroke-width="2"/>
  <polygon points="175,240 160,233 160,247" fill="#4fd1c5"/>

  <!-- layer 01 -->
  <rect x="190" y="150" width="700" height="112" rx="10" fill="url(#box)" stroke="#2c6d7c" stroke-width="1.6"/>
  <text x="220" y="198" fill="#e6f1f5" font-size="27" font-weight="700">Proxy layer</text>
  <text x="220" y="232" fill="#8fb3c4" font-size="19">lifecycle &amp; app state · event bus · frequency capping</text>
  <text x="858" y="212" fill="#4fd1c5" font-size="26" font-weight="700" text-anchor="end">01</text>

  <!-- layer 02 -->
  <rect x="190" y="300" width="700" height="112" rx="10" fill="url(#box)" stroke="#2c6d7c" stroke-width="1.6"/>
  <text x="220" y="348" fill="#e6f1f5" font-size="27" font-weight="700">Provider adapter</text>
  <text x="220" y="382" fill="#8fb3c4" font-size="19">network adapters · template &amp; self-render · bidding</text>
  <text x="858" y="362" fill="#4fd1c5" font-size="26" font-weight="700" text-anchor="end">02</text>

  <!-- layer 03 -->
  <rect x="190" y="450" width="700" height="112" rx="10" fill="url(#box)" stroke="#2c6d7c" stroke-width="1.6"/>
  <text x="220" y="498" fill="#e6f1f5" font-size="27" font-weight="700">Loader layer</text>
  <text x="220" y="532" fill="#8fb3c4" font-size="19">config delivery · cache · preload · fallback</text>
  <text x="858" y="512" fill="#4fd1c5" font-size="26" font-weight="700" text-anchor="end">03</text>

  <!-- connectors between layers -->
  <line x1="540" y1="262" x2="540" y2="300" stroke="#3b7f92" stroke-width="2"/>
  <line x1="540" y1="412" x2="540" y2="450" stroke="#3b7f92" stroke-width="2"/>

  <!-- networks -->
  <text x="1010" y="184" fill="#7d93a8" font-size="17" letter-spacing="3">AD NETWORKS</text>
  <g fill="#0d2233" stroke="#2a5c6e" stroke-width="1.5">
    <rect x="1010" y="204" width="118" height="46" rx="6"/>
    <rect x="1144" y="204" width="118" height="46" rx="6"/>
    <rect x="1278" y="204" width="118" height="46" rx="6"/>
    <rect x="1010" y="264" width="118" height="46" rx="6"/>
    <rect x="1144" y="264" width="118" height="46" rx="6"/>
    <rect x="1278" y="264" width="118" height="46" rx="6"/>
  </g>
  <g fill="#cfe3ec" font-size="18" text-anchor="middle">
    <text x="1069" y="234">AdMob</text>
    <text x="1203" y="234">Pangle</text>
    <text x="1337" y="234">GDT</text>
    <text x="1069" y="294">Kuaishou</text>
    <text x="1203" y="294">Mintegral</text>
    <text x="1337" y="294">+ more</text>
  </g>
  <line x1="890" y1="356" x2="1010" y2="356" stroke="#3b7f92" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="1010" cy="356" r="4" fill="#3b7f92"/>

  <!-- stats -->
  <line x1="60" y1="650" x2="1540" y2="650" stroke="#1f4056" stroke-width="1.5"/>
  <g fill="#7d93a8" font-size="17" letter-spacing="3">
    <text x="60" y="700">NETWORKS</text>
    <text x="390" y="700">FORMATS</text>
    <text x="720" y="700">BRIDGES</text>
    <text x="1050" y="700">PLUGIN-LAYER BUSINESS LOGIC</text>
  </g>
  <g fill="#e6f1f5" font-size="44" font-weight="700">
    <text x="60" y="756">10+</text>
    <text x="390" y="756">5</text>
    <text x="720" y="756">3</text>
    <text x="1050" y="756">0</text>
  </g>
  <g fill="#8fb3c4" font-size="17">
    <text x="60" y="790">mediation partners integrated</text>
    <text x="390" y="790">rewarded · interstitial · splash</text>
    <text x="390" y="812">native · banner</text>
    <text x="720" y="790">Android · Flutter · React Native</text>
    <text x="1050" y="790">one native core, reused by every host</text>
  </g>
</svg>
