<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="广告聚合平台拓扑示意">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050D14"/><stop offset="1" stop-color="#04080D"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0H40M0 0V40" stroke="rgba(120,180,205,0.10)" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="40" y="48" fill="#F0B45C" font-size="12" letter-spacing="2.4">PLATFORM / TOPOLOGY</text>
    <text x="760" y="48" fill="#5C7187" font-size="11" letter-spacing="1.6" text-anchor="end">THREE APPS · ONE API</text>

    <!-- 左侧两端 -->
    <rect x="40" y="104" width="150" height="70" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.25)"/>
    <text x="58" y="126" fill="#8FA3B8" font-size="10" letter-spacing="1.4">CONSOLE / 01</text>
    <text x="58" y="148" fill="#E8EFF7" font-size="13" font-family="PingFang SC,Noto Sans SC,sans-serif">开发者后台</text>
    <text x="58" y="164" fill="#5C7187" font-size="10">Vue3 · 应用 / 广告位</text>

    <rect x="40" y="190" width="150" height="70" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.25)"/>
    <text x="58" y="212" fill="#8FA3B8" font-size="10" letter-spacing="1.4">CONSOLE / 02</text>
    <text x="58" y="234" fill="#E8EFF7" font-size="13" font-family="PingFang SC,Noto Sans SC,sans-serif">发布者后台</text>
    <text x="58" y="250" fill="#5C7187" font-size="10">Vue3 · 瀑布流 / 报表</text>

    <!-- 中间 API -->
    <rect x="260" y="104" width="230" height="156" rx="12" fill="rgba(240,180,92,0.06)" stroke="rgba(240,180,92,0.35)"/>
    <text x="278" y="128" fill="#F0B45C" font-size="10" letter-spacing="1.4">CORE API</text>
    <text x="278" y="152" fill="#E8EFF7" font-size="15" font-family="PingFang SC,Noto Sans SC,sans-serif" font-weight="600">alioth · Koa2 + TS</text>
    <g fill="#93A7BC" font-size="11" font-family="ui-monospace,Menlo,monospace">
      <text x="278" y="180">· 261 个前端接口</text>
      <text x="278" y="200">· 35 张表 / Prisma</text>
      <text x="278" y="220">· 权限 55 码 ⊆ 68 种子</text>
      <text x="278" y="240">· OSS 直传签名</text>
    </g>

    <line x1="190" y1="139" x2="258" y2="139" stroke="rgba(47,227,200,0.55)" stroke-width="1.2"/>
    <line x1="190" y1="225" x2="258" y2="200" stroke="rgba(47,227,200,0.55)" stroke-width="1.2"/>
    <path d="M252 135L258 139L252 143" fill="none" stroke="#2FE3C8" stroke-width="1.2"/>

    <!-- 右侧基础设施 -->
    <rect x="550" y="96" width="210" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="566" y="118" fill="#93A7BC" font-size="11" font-family="ui-monospace,Menlo,monospace">MySQL / Prisma</text>
    <rect x="550" y="140" width="210" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="566" y="162" fill="#93A7BC" font-size="11" font-family="ui-monospace,Menlo,monospace">Redis / BullMQ 队列</text>
    <rect x="550" y="184" width="210" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="566" y="206" fill="#93A7BC" font-size="11" font-family="ui-monospace,Menlo,monospace">OSS / 日志与告警</text>

    <line x1="490" y1="160" x2="548" y2="160" stroke="rgba(74,168,255,0.5)" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- 下方流水线 -->
    <line x1="40" y1="300" x2="760" y2="300" stroke="rgba(125,170,205,0.16)"/>
    <text x="40" y="326" fill="#8FA3B8" font-size="10" letter-spacing="1.4">DELIVERY PIPELINE</text>

    <rect x="40" y="344" width="160" height="56" rx="8" fill="rgba(47,227,200,0.07)" stroke="rgba(47,227,200,0.3)"/>
    <text x="56" y="366" fill="#E8EFF7" font-size="12" font-family="PingFang SC,Noto Sans SC,sans-serif">SDK 打包服务</text>
    <text x="56" y="384" fill="#5C7187" font-size="10">6 平台勾选出包</text>

    <rect x="224" y="344" width="160" height="56" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="240" y="366" fill="#E8EFF7" font-size="12" font-family="PingFang SC,Noto Sans SC,sans-serif">报表模板</text>
    <text x="240" y="384" fill="#5C7187" font-size="10">日报 / 小时报表</text>

    <rect x="408" y="344" width="160" height="56" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="424" y="366" fill="#E8EFF7" font-size="12" font-family="PingFang SC,Noto Sans SC,sans-serif">调用观测</text>
    <text x="424" y="384" fill="#5C7187" font-size="10">错误率 / 耗时告警</text>

    <rect x="592" y="344" width="168" height="56" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
    <text x="608" y="366" fill="#E8EFF7" font-size="12" font-family="PingFang SC,Noto Sans SC,sans-serif">31 项冒烟</text>
    <text x="608" y="384" fill="#5C7187" font-size="10">CI 内可回归</text>

    <g font-size="11" fill="#5C7187" font-family="ui-monospace,Menlo,monospace" letter-spacing="1.2">
      <text x="40" y="446">STACK</text>
      <text x="40" y="468" fill="#93A7BC">Koa2 · Prisma · MySQL · Redis · BullMQ · Vue3 · OSS</text>
    </g>
  </g>
</svg>
