<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="聚合广告 SDK 三层架构示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061019"/><stop offset="1" stop-color="#04090F"/>
    </linearGradient>
    <linearGradient id="lay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(47,227,200,0.16)"/>
      <stop offset="1" stop-color="rgba(74,168,255,0.08)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0H40M0 0V40" stroke="rgba(120,180,205,0.10)" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="40" y="48" fill="#2FE3C8" font-size="12" letter-spacing="2.4">SDK / LAYERED ARCHITECTURE</text>
    <text x="760" y="48" fill="#5C7187" font-size="11" letter-spacing="1.6" text-anchor="end">ANDROID · FLUTTER · REACT NATIVE</text>

    <!-- 业务侧 -->
    <text x="40" y="116" fill="#8FA3B8" font-size="11" letter-spacing="1.6">HOST APP</text>
    <line x1="40" y1="130" x2="120" y2="130" stroke="#2FE3C8" stroke-width="1.5"/>
    <path d="M114 126L120 130L114 134" fill="none" stroke="#2FE3C8" stroke-width="1.5"/>

    <!-- 三层 -->
    <g>
      <rect x="130" y="104" width="430" height="62" rx="10" fill="url(#lay)" stroke="rgba(47,227,200,0.45)"/>
      <text x="152" y="130" fill="#E8EFF7" font-size="15" font-family="PingFang SC,Noto Sans SC,sans-serif" font-weight="600">Proxy 代理层</text>
      <text x="152" y="150" fill="#8FA3B8" font-size="11" letter-spacing="1.2">生命周期劫持 · 事件总线 · 频控与防抖</text>
      <text x="540" y="141" fill="#2FE3C8" font-size="12" text-anchor="end">01</text>
    </g>
    <g>
      <rect x="130" y="184" width="430" height="62" rx="10" fill="url(#lay)" stroke="rgba(47,227,200,0.32)"/>
      <text x="152" y="210" fill="#E8EFF7" font-size="15" font-family="PingFang SC,Noto Sans SC,sans-serif" font-weight="600">Provider 适配层</text>
      <text x="152" y="230" fill="#8FA3B8" font-size="11" letter-spacing="1.2">平台接入 · 自渲染 / 模板渲染 · 出价</text>
      <text x="540" y="221" fill="#2FE3C8" font-size="12" text-anchor="end">02</text>
    </g>
    <g>
      <rect x="130" y="264" width="430" height="62" rx="10" fill="url(#lay)" stroke="rgba(47,227,200,0.22)"/>
      <text x="152" y="290" fill="#E8EFF7" font-size="15" font-family="PingFang SC,Noto Sans SC,sans-serif" font-weight="600">Loader 加载层</text>
      <text x="152" y="310" fill="#8FA3B8" font-size="11" letter-spacing="1.2">配置下发 · 缓存 · 预加载 · 兜底</text>
      <text x="540" y="301" fill="#2FE3C8" font-size="12" text-anchor="end">03</text>
    </g>

    <line x1="345" y1="166" x2="345" y2="184" stroke="#2FE3C8" stroke-width="1.2"/>
    <line x1="345" y1="246" x2="345" y2="264" stroke="#2FE3C8" stroke-width="1.2"/>

    <!-- 右：平台 -->
    <text x="610" y="116" fill="#8FA3B8" font-size="11" letter-spacing="1.6">AD NETWORKS</text>
    <g fill="#93A7BC" font-size="11" font-family="ui-monospace,Menlo,monospace">
      <rect x="608" y="130" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="620" y="146">CSJ</text>
      <rect x="688" y="130" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="700" y="146">YLH</text>
      <rect x="608" y="162" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="620" y="178">KS</text>
      <rect x="688" y="162" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="700" y="178">ADM</text>
      <rect x="608" y="194" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="620" y="210">TPM</text>
      <rect x="688" y="194" width="72" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(125,170,205,0.22)"/>
      <text x="700" y="210">SGM</text>
    </g>
    <line x1="560" y1="215" x2="606" y2="215" stroke="rgba(74,168,255,0.5)" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- 底部指标 -->
    <line x1="40" y1="404" x2="760" y2="404" stroke="rgba(125,170,205,0.16)"/>
    <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5C7187" letter-spacing="1.2">
      <text x="40" y="432">PLATFORMS</text><text x="40" y="456" fill="#E8EFF7" font-size="20">7+</text>
      <text x="220" y="432">FORMATS</text><text x="220" y="456" fill="#E8EFF7" font-size="20">5</text>
      <text x="400" y="432">BRIDGE</text><text x="400" y="456" fill="#E8EFF7" font-size="20">3 端</text>
      <text x="580" y="432">NATIVE REUSE</text><text x="580" y="456" fill="#E8EFF7" font-size="20">100%</text>
    </g>
  </g>
</svg>
